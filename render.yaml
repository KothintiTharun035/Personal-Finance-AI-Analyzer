services:
  - type: web
    name: finance-ai-backend
    runtime: java

    rootDir: backend

    buildCommand: chmod +x mvnw && ./mvnw clean package

    startCommand: java -jar target/*.jar

    plan: free

    envVars:
      - key: MONGODB_URI
        sync: false

      - key: JWT_SECRET
        sync: false

      - key: GEMINI_API_KEY
        sync: false